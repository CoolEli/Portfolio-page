<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Design — Hover Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles-v2.css">
<style id="eli-theme">/* ===== ELI.Z unified theme layer (matches CV homepage) ===== */
:root{--red:#f2501f;--red-deep:#d9441a;--pink:#f2501f;--pink-deep:#d9441a;--accent:#f2501f;
  --eli-red:#f2501f;--eli-glow:rgba(242,80,31,.45);--eli-line:rgba(255,255,255,.08);--eli-line2:rgba(255,255,255,.16);
  --eli-sans:"PingFang SC","PingFang TC","苹方-简","Helvetica Neue","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --eli-dot:"Doto",ui-monospace,monospace;--eli-ease:cubic-bezier(.22,1,.36,1)}
html{scroll-behavior:smooth}
body{font-family:var(--eli-sans)}
::selection{background:var(--eli-red);color:#fff}
:focus-visible{outline:1px solid var(--eli-red)!important;outline-offset:3px}

/* background layers, same as homepage */
.eli-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--eli-line) 1px,transparent 1px),linear-gradient(90deg,var(--eli-line) 1px,transparent 1px);
  background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);opacity:.45}
.eli-scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.eli-glow{position:fixed;left:0;top:0;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(255,255,255,.05),transparent 65%);transform:translate(-50%,-50%);opacity:0;transition:opacity .4s}

/* ---------- header: homepage style ---------- */
.site-header,.topbar{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  padding:14px clamp(18px,4vw,48px)!important;border-bottom:1px solid transparent;transition:background .4s,border-color .4s;pointer-events:none}
.site-header.eli-scrolled,.topbar.eli-scrolled{background:rgba(5,5,5,.72)!important;-webkit-backdrop-filter:blur(14px)!important;backdrop-filter:blur(14px)!important;border-color:var(--eli-line)}
.header-inner,.topbar-inner{max-width:none!important;display:flex!important;align-items:center;justify-content:space-between;gap:16px;pointer-events:auto}
.nav-center{display:flex!important;align-items:center;gap:22px;min-width:0;flex:1 1 auto}
.site-header .brand,.topbar .brand{display:none!important}
.eli-brand{display:inline-flex;align-items:baseline;gap:10px;font-family:var(--eli-dot);font-weight:800;font-size:22px;letter-spacing:.04em;color:#fff;text-decoration:none;white-space:nowrap;flex:0 0 auto}
.eli-brand b{color:var(--eli-red)}
.eli-brand small{font-size:12px;letter-spacing:.18em;color:#777;font-weight:800}
.eli-brand:hover small{color:var(--eli-red)}
.nav-pill{height:auto!important;background:#f2f2f2!important;border:0!important;border-radius:8px!important;box-shadow:none!important;padding:4px!important;gap:2px!important;margin:0 auto!important;flex:0 1 auto!important;width:auto!important}
.nav-pill .nav-link,.nav-pill a.nl,.nav-pill a{font-family:var(--eli-dot)!important;font-weight:800!important;font-size:14px!important;letter-spacing:.02em!important;
  padding:7px 14px!important;border-radius:6px;color:#555!important;transition:color .3s,background .3s}
.nav-pill .nav-link::after,.nav-pill a.nl::after,.nav-pill a::before{display:none!important}
.nav-pill a:hover{color:#000!important}
.nav-pill a.active,.nav-pill a.on{color:#fff!important;background:#000!important}
.eli-tools{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.lang-toggle,.site-header .lang{display:flex!important;align-items:stretch;height:auto!important;background:transparent!important;border:1px solid var(--eli-line2)!important;border-radius:6px!important;box-shadow:none!important;padding:0!important;overflow:hidden}
.lang .knob{display:none!important}
.lang-toggle button,.site-header .lang button{font-family:var(--eli-dot)!important;font-weight:800!important;font-size:13px!important;background:none!important;border:0!important;border-radius:0!important;color:#a3a3a6!important;opacity:1!important;padding:7px 12px!important;cursor:pointer;transition:background .25s,color .25s}
.lang-toggle button.active,.lang-toggle button.on,.site-header .lang button.on{background:#fff!important;color:#000!important}
/* back home button lives in header */
.eli-home{display:flex;align-items:center;gap:12px;font-family:var(--eli-dot);font-weight:800;font-size:14px;padding:4px 16px 4px 4px;border-radius:8px;background:#111;border:1px solid var(--eli-line2);color:#fff;text-decoration:none;white-space:nowrap;transition:all .3s var(--eli-ease)}
.eli-home i{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;background:#000;border:1px solid var(--eli-line2);font-style:normal;transition:background .3s,transform .3s var(--eli-ease)}
.eli-home:hover{border-color:var(--eli-red);box-shadow:0 0 24px var(--eli-glow)}
.eli-home:hover i{background:var(--eli-red);border-color:var(--eli-red);transform:translateX(-2px)}
.fab-home{display:none!important}
@media (max-width:900px){.nav-pill{display:none!important}.eli-brand small{display:none}}
@media (max-width:520px){.eli-home span{display:none}.eli-home{padding:4px}}

/* floating buttons: homepage square style */
.fab{border-radius:8px!important;background:#111!important;color:#fff!important;border:1px solid var(--eli-line2)!important;box-shadow:none!important;font-family:var(--eli-dot)!important;font-weight:800!important;transition:all .3s var(--eli-ease)!important}
.fab:hover{background:#111!important;border-color:var(--eli-red)!important;box-shadow:0 0 24px var(--eli-glow)!important;color:#fff!important}
.fab i,.fab svg{color:var(--eli-red)}

/* generic button feedback */
button,.fab,.eli-home,.eli-next a,a[class*="btn"]{-webkit-tap-highlight-color:transparent}
button:active,.fab:active,.eli-home:active,a[class*="btn"]:active{transform:scale(.97)}
.eli-ping{position:fixed;width:10px;height:10px;border:1px solid var(--eli-red);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);animation:eliPing .5s var(--eli-ease) forwards}
@keyframes eliPing{to{width:46px;height:46px;opacity:0}}

/* design-software chrome: rulers, guides, inspector */
.eli-rx,.eli-ry{position:fixed;left:0;top:0;z-index:58;pointer-events:none}
.eli-ry{top:16px}
.eli-gx,.eli-gy{position:fixed;z-index:39;pointer-events:none;opacity:0;transition:opacity .3s}
.eli-gx{left:16px;right:0;top:0;height:0;border-top:1px dashed rgba(242,80,31,.32)}
.eli-gy{top:16px;bottom:0;left:0;width:0;border-left:1px dashed rgba(242,80,31,.32)}
html.eli-chrome .site-header,html.eli-chrome .topbar{padding-top:24px!important;padding-left:calc(16px + clamp(18px,4vw,48px))!important}
.eli-sel{position:fixed;pointer-events:none;z-index:57;border:1px solid var(--eli-red);opacity:0;transition:opacity .2s,left .18s var(--eli-ease),top .18s var(--eli-ease),width .18s var(--eli-ease),height .18s var(--eli-ease)}
.eli-sel.on{opacity:1}
.eli-sel i{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--eli-red)}
.eli-sel i:nth-child(1){left:-4px;top:-4px}.eli-sel i:nth-child(2){right:-4px;top:-4px}.eli-sel i:nth-child(3){left:-4px;bottom:-4px}.eli-sel i:nth-child(4){right:-4px;bottom:-4px}
.eli-sel span{position:absolute;left:-1px;top:-21px;font:10.5px/1 ui-monospace,monospace;background:var(--eli-red);color:#fff;padding:4px 6px;white-space:nowrap}
.eli-sel em{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font:10.5px/1 ui-monospace,monospace;font-style:normal;background:var(--eli-red);color:#fff;border-radius:3px;padding:4px 6px;white-space:nowrap}

/* progress + HUD */
.eli-progress{position:fixed;left:0;top:0;height:2px;width:0;background:var(--eli-red);z-index:200;box-shadow:0 0 10px var(--eli-glow)}
.eli-hud{position:fixed;left:calc(16px + clamp(14px,2.4vw,26px));bottom:clamp(14px,2.4vw,26px);z-index:55;font:11px/1.5 ui-monospace,monospace;color:#666;letter-spacing:.06em;pointer-events:none}
.eli-hud b{color:#ddd;font-weight:400}.eli-hud .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--eli-red);margin-right:6px;box-shadow:0 0 8px var(--eli-red);animation:eliBlink 1.6s infinite}
@keyframes eliBlink{50%{opacity:.25}}
@media (max-width:700px){.eli-hud{display:none}}

/* next project bar */
.eli-next{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;padding:40px clamp(18px,4vw,48px) 30px;border-top:1px solid var(--eli-line);background:#050505;margin-top:60px}
.eli-next a{display:flex;flex-direction:column;gap:8px;padding:22px 24px;border:1px solid var(--eli-line);border-radius:10px;background:#0c0c0d;color:#f5f5f5;text-decoration:none;position:relative;overflow:hidden;transition:border-color .35s,box-shadow .35s}
.eli-next a::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--x,50%) var(--y,50%),rgba(242,80,31,.16),transparent 60%);opacity:0;transition:opacity .35s}
.eli-next a:hover{border-color:var(--eli-red);box-shadow:0 0 30px rgba(242,80,31,.18)}
.eli-next a:hover::before{opacity:1}
.eli-next small{font-family:var(--eli-dot);font-weight:800;font-size:12px;letter-spacing:.24em;color:var(--eli-red)}
.eli-next strong{font-family:var(--eli-dot);font-weight:800;font-size:clamp(18px,2vw,26px);letter-spacing:.02em}
.eli-next .nx{text-align:right;align-items:flex-end}
.eli-next .hm{justify-content:center;align-items:center;min-width:140px}
.eli-next .hm strong{font-size:16px}
.eli-foot{position:relative;z-index:3;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding:18px clamp(18px,4vw,48px) 26px;background:#050505;color:#5f5f63;font-size:12px}
.eli-foot .d{font-family:var(--eli-dot);font-weight:800;letter-spacing:.1em}
@media (max-width:760px){.eli-next{grid-template-columns:1fr 1fr}.eli-next .hm{grid-column:1/-1;order:3}}

/* page transition, same language as the homepage splash */
.eli-veil{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;transition:transform .6s var(--eli-ease)}
.eli-veil.out{transform:translateY(-100%)}
.eli-veil.idle{transform:translateY(100%);transition:none}
.eli-veil.in{transform:translateY(0)}
.eli-veil .t{font-family:var(--eli-dot);font-weight:900;font-size:clamp(34px,6vw,78px);color:#fff;letter-spacing:.02em;text-align:center;line-height:1.05;padding:0 20px}
.eli-veil .l{font-family:var(--eli-dot);font-weight:800;font-size:12px;letter-spacing:.4em;color:#777;margin-top:14px;text-align:center}
.eli-veil .b{width:200px;height:2px;background:#222;margin:18px auto 0;overflow:hidden}
.eli-veil .b i{display:block;height:100%;width:0;background:var(--eli-red);transition:width .45s var(--eli-ease)}
.eli-veil.ready .b i{width:100%}
@media (prefers-reduced-motion:reduce){.eli-veil{display:none}}
</style>
</head>
<body>

  <a class="fab fab-home" href="https://cooleli.github.io/CV-project/v2/#projects" aria-label="Back home"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg><span data-en="Back home" data-zh="返回首页">Back home</span></a>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="nav-center">
      <span class="brand"><span class="dot"></span>PRODUCT&nbsp;DESIGN</span>
      <nav class="nav-pill" aria-label="Sections">
        <a class="nav-link active" href="#partA" data-nav="a"><span data-en="Academic" data-zh="在校设计">Academic</span></a>
        <a class="nav-link" href="#partB" data-nav="b"><span data-en="Commercial" data-zh="商业设计">Commercial</span></a>
      </nav>
    </div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="on">EN</button><button type="button" data-lang="zh">中</button>
      </div>
    </div>
  </header>

  <!-- 在校设计 / Academic -->
  <section class="part" id="partA">
    <div class="part-kicker"><span class="dot">●</span>&nbsp; <span data-en="Academic Works" data-zh="在校设计">Academic Works</span> &nbsp;/&nbsp; 01</div>
    <div class="members" id="membersA">
      <div class="name-wrap" id="nameWrapA"><div class="giant" id="nameA"></div></div>
      <p class="desc" id="descA"></p>
    </div>
  </section>

  <!-- 商业设计 / Commercial -->
  <section class="part" id="partB">
    <div class="part-kicker"><span class="dot">●</span>&nbsp; <span data-en="Commercial Works" data-zh="商业设计">Commercial Works</span> &nbsp;/&nbsp; 02</div>
    <div class="members" id="membersB">
      <div class="name-wrap" id="nameWrapB"><div class="giant" id="nameB"></div></div>
      <p class="desc" id="descB"></p>
    </div>
  </section>

  <div class="footer">12 WORKS · 2018 — 2024</div>

  <!-- click viewer: photo expands to fill the frame -->
  <div id="viewer" hidden>
    <div class="viewer-backdrop" id="viewerBackdrop"></div>
    <img id="viewerImg" alt="">
    <div class="viewer-kicker" id="viewerKicker"></div>
    <div class="giant viewer-name" id="viewerName"></div>
    <p class="viewer-desc" id="viewerDesc"></p>
    <div class="viewer-hint" data-en="Click image to zoom · Click elsewhere or ESC to close" data-zh="点击图片缩放 · 点击别处或按 ESC 关闭">Click image to zoom · Click elsewhere or ESC to close</div>
    <button id="viewerClose" type="button" aria-label="Close">✕</button>
  </div>

  <div id="badge"><div class="badge-dot">↗</div></div>
  <div class="hint" id="hint" data-en="Hover the works" data-zh="悬停查看作品">Hover the works</div>

  <script src="./app-v2.js"></script>

<script>window.ELI_PAGE={id:"product"};
/* ===== ELI.Z unified theme layer: header, transitions, interactions ===== */
(function(){
  var HOME="https://cooleli.github.io/CV-project/v2/";
  var BASE="https://cooleli.github.io/Portfolio-page/";
  var LIST=[
    {id:"bronze",en:"Bronze Ware",zh:"青铜器手势交互",p:"Bronze%20Heritage%20Gesture%20Interaction%20project/"},
    {id:"dunhuang",en:"Stone Reveal",zh:"敦煌互动遗产",p:"Dunhuang%20Interactive%20Heritage%20project/"},
    {id:"mr",en:"RV × MR",zh:"MR 房车内饰定制",p:"MR%20RV%20Interior%20Customization%20project/"},
    {id:"app",en:"Jiuli APP",zh:"九里 APP 交互设计",p:"APP%20Interaction%20Design%20project/"},
    {id:"product",en:"Product Design",zh:"产品设计",p:"Product%20Design%20project/"}];
  var me=window.ELI_PAGE||{id:"bronze"},idx=0;LIST.forEach(function(x,i){if(x.id===me.id)idx=i});
  var cur=LIST[idx],prev=LIST[(idx+LIST.length-1)%LIST.length],next=LIST[(idx+1)%LIST.length];
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
  function zh(){return /^zh/.test(document.documentElement.lang)||document.documentElement.classList.contains("zh")}
  function bi(en,z){return '<span data-en="'+en+'" data-zh="'+z+'">'+en+'</span>'}

  /* veil: enter animation */
  var veil=el("div","eli-veil",'<div><div class="t">'+cur.en.toUpperCase()+'</div><div class="l">ELI.Z / PROJECT '+String(idx+1).padStart(2,"0")+'</div><div class="b"><i></i></div></div>');
  document.body.appendChild(veil);
  requestAnimationFrame(function(){veil.classList.add("ready")});
  setTimeout(function(){veil.classList.add("out")},reduce?0:480);

  /* background layers */
  ["eli-grid","eli-scan"].forEach(function(c){document.body.insertBefore(el("div",c),document.body.firstChild)});
  var glow=el("div","eli-glow");document.body.appendChild(glow);
  var prog=el("div","eli-progress");document.body.appendChild(prog);

  /* header: brand + tools */
  var hdr=document.querySelector(".site-header,.topbar");
  if(hdr){
    var inner=hdr.querySelector(".header-inner,.topbar-inner")||hdr;
    var center=inner.querySelector(".nav-center")||inner;
    var brand=el("a","eli-brand",'ELI<b>.</b>Z<small>/ '+cur.en.toUpperCase()+'</small>');brand.href=HOME;brand.setAttribute("aria-label","Eli Zeng — home");
    center.insertBefore(brand,center.firstChild);
    var tools=el("div","eli-tools");
    var lang=inner.querySelector(".lang-toggle,.lang");if(lang)tools.appendChild(lang);
    var home=el("a","eli-home",'<i>‹</i>'+bi("Home","返回首页"));home.href=HOME+"#projects";
    tools.appendChild(home);inner.appendChild(tools);
    addEventListener("scroll",function(){hdr.classList.toggle("eli-scrolled",scrollY>40)},{passive:true});
  }

  /* next / previous project + footer */
  var nav=el("nav","eli-next",
    '<a class="pv" href="'+BASE+prev.p+'v2.html"><small>← PREV</small><strong data-en="'+prev.en+'" data-zh="'+prev.zh+'">'+prev.en+'</strong></a>'+
    '<a class="hm" href="'+HOME+'#projects"><small>ELI.Z</small><strong>'+bi("All projects","全部项目")+'</strong></a>'+
    '<a class="nx" href="'+BASE+next.p+'v2.html"><small>NEXT →</small><strong data-en="'+next.en+'" data-zh="'+next.zh+'">'+next.en+'</strong></a>');
  var foot=el("div","eli-foot",'<span class="d">© 2026 HANLEI ZENG · ELI.Z</span><span>'+bi("Project "+(idx+1)+" of "+LIST.length,"项目 "+(idx+1)+" / "+LIST.length)+'</span>');
  document.body.appendChild(nav);document.body.appendChild(foot);
  nav.querySelectorAll("a").forEach(function(a){a.addEventListener("pointermove",function(e){var r=a.getBoundingClientRect();a.style.setProperty("--x",(e.clientX-r.left)+"px");a.style.setProperty("--y",(e.clientY-r.top)+"px")})});

  /* HUD */
  var hud=el("div","eli-hud",'<span class="d"></span>'+cur.en.toUpperCase()+' · <b id="eliPct">000%</b><br>PTR <b id="eliPtr">X0000 Y0000</b>');document.body.appendChild(hud);
  var pct=document.getElementById("eliPct"),ptr=document.getElementById("eliPtr");
  function onScroll(){var h=document.documentElement.scrollHeight-innerHeight,p=h>0?scrollY/h:0;prog.style.width=(p*100)+"%";pct.textContent=String(Math.round(p*100)).padStart(3,"0")+"%"}
  addEventListener("scroll",onScroll,{passive:true});onScroll();

  /* shared language: homepage and every project page remember the same choice */
  function syncLang(){var l;try{l=localStorage.getItem("lang")}catch(e){}
    if(l!=="zh"&&l!=="en")return;var b=document.querySelector('[data-lang="'+l+'"],[data-l="'+l+'"]');if(b&&!b.classList.contains("active")&&!b.classList.contains("on"))b.click();applyBi(l)}
  function applyBi(l){[nav,foot,tools||document.createElement("i")].forEach(function(r){r.querySelectorAll("[data-en]").forEach(function(s){s.textContent=s.getAttribute("data-"+l)})})}
  document.addEventListener("click",function(e){var b=e.target.closest("[data-lang],[data-l]");if(!b)return;var l=b.getAttribute("data-lang")||b.getAttribute("data-l");
    try{localStorage.setItem("lang",l)}catch(_){}setTimeout(function(){applyBi(l)},0)});
  function initLang(){setTimeout(function(){syncLang();applyBi(zh()?"zh":"en")},0)}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initLang);else initLang();

  /* pointer: glow, HUD coordinates, click ping */
  var gx=0,gy=0,tx=0,ty=0,raf=0;
  addEventListener("pointermove",function(e){tx=e.clientX;ty=e.clientY;glow.style.opacity=1;ptr.textContent="X"+String(Math.round(tx)).padStart(4,"0")+" Y"+String(Math.round(ty+scrollY)).padStart(4,"0");if(!raf)raf=requestAnimationFrame(loop)},{passive:true});
  function loop(){gx+=(tx-gx)*.18;gy+=(ty-gy)*.18;glow.style.transform="translate("+(gx-260)+"px,"+(gy-260)+"px)";raf=Math.abs(tx-gx)+Math.abs(ty-gy)>.5?requestAnimationFrame(loop):0}
  glow.style.left="0";glow.style.top="0";
  document.addEventListener("pointerdown",function(e){if(reduce)return;var p=el("i","eli-ping");p.style.left=e.clientX+"px";p.style.top=e.clientY+"px";document.body.appendChild(p);setTimeout(function(){p.remove()},520)});

  /* design-software chrome: rulers, guides, Figma-style inspector (same as homepage) */
  var fine=matchMedia("(hover:hover) and (min-width:761px)").matches;
  var rx=el("canvas","eli-rx"),ry=el("canvas","eli-ry"),gX=el("div","eli-gx"),gY=el("div","eli-gy");
  if(fine){[rx,ry,gX,gY].forEach(function(c){document.body.appendChild(c)});document.documentElement.classList.add("eli-chrome")}
  var mxp=-1,myp=-1;
  function drawR(){if(!fine)return;var d=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight,S=16;
    [[rx,W,S],[ry,S,H]].forEach(function(o){var c=o[0];if(c.width!==o[1]*d||c.height!==o[2]*d){c.width=o[1]*d;c.height=o[2]*d;c.style.width=o[1]+"px";c.style.height=o[2]+"px"}});
    var x=rx.getContext("2d");x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,S);x.fillStyle="rgba(10,10,10,.82)";x.fillRect(0,0,W,S);
